<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер задач</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        form { margin-bottom: 20px; display: flex; gap: 8px; }
        input[type="text"] { flex: 1; padding: 8px; font-size: 16px; }
        button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { padding: 12px; border: 1px solid #ddd; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .done { text-decoration: line-through; color: #888; }
        .date { font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <h1>Трекер задач</h1>
    <form action="/add" method="POST">
        <input type="text" name="title" placeholder="Новая задача" required maxlength="200">
        <button type="submit">Добавить</button>
    </form>
    <ul>
        {{range .Tasks}}
        <li>
            <span class="{{if .Done}}done{{end}}">{{.Title}}</span>
            <span class="date">{{.CreatedAt.Format "02.01.2006 15:04"}}</span>
        </li>
        {{else}}
        <li>Задач пока нет. Добавьте первую!</li>
        {{end}}
    </ul>
</body>
</html>
